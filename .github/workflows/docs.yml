name: Docs

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build main docs
        run: |
          cargo doc --no-deps
          mkdir -p "$RUNNER_TEMP/site/main"
          cp -a target/doc/. "$RUNNER_TEMP/site/main/"
      - name: Build latest release docs
        run: |
          release_tag="$(git tag --list --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          mkdir -p "$RUNNER_TEMP/site/release/tinyopt"
          if [ -z "$release_tag" ]; then
            cat > "$RUNNER_TEMP/site/release/tinyopt/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
            <meta charset="utf-8">
            <title>Release documentation</title>
            <p>No version tag has been published yet.</p>
          </html>
          EOF
            exit 0
          fi
          git checkout --detach "$release_tag"
          cargo doc --no-deps
          cp -a target/doc/. "$RUNNER_TEMP/site/release/"
      - name: Create documentation index
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
            <meta charset="utf-8">
            <title>tinyopt documentation</title>
            <h1>tinyopt documentation</h1>
            <ul>
              <li><a href="./main/tinyopt/">Main branch</a></li>
              <li><a href="./release/tinyopt/">Latest release</a></li>
            </ul>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
