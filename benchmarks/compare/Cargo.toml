[package]
name = "tinyopt-bench-compare"
version = "0.8.0"
edition = "2024"
publish = false

# Standalone package: keep the Ceres build out of the library's test loop.
[workspace]

[dependencies]
tinyopt = { path = "../..", default-features = false, features = ["nalgebra"] }
ceres-solver = { version = "0.5", default-features = false, features = ["source"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-traits = "0.2"
quick-xml = "0.37"
