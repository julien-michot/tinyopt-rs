[workspace]
name = "tinyopt"
version = "0.8.0"
description = "A lightweight, Rust native optimization library"
authors = ["Julien Michot"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
rust = ">=1.85"

[feature.suitesparse.dependencies]
suitesparse = ">=7.10"

[feature.bench.dependencies]
cmake = "*"
ninja = "*"
python = "3.12.*"
matplotlib = ">=3.8"

[feature.bench.target.linux-64.dependencies]
c-compiler = "*"
cxx-compiler = "*"

[feature.bench.activation.env]
CMAKE_TOOLCHAIN_FILE = "$PIXI_PROJECT_ROOT/benchmarks/compare/cmake/disable-cuda.cmake"

[environments]
bench = ["bench"]
suitesparse = ["suitesparse"]

[tasks]
build = "cargo build --all-targets"
test = "cargo test"
test-nalgebra = "cargo test --no-default-features --features nalgebra"
test-faer = "cargo test --no-default-features --features faer"
test-suitesparse = { cmd = "cargo test --features suitesparse", default-environment = "suitesparse" }
fmt = "cargo fmt --all -- --check && cargo fmt --manifest-path benchmarks/compare/Cargo.toml --all -- --check"
clippy = "cargo clippy --all-targets -- -D warnings"
doc = "cargo doc --no-deps"
bench = "cargo bench --bench dense"
examples = "for e in astronomy biology computer_vision finance physics robotics signal_processing; do cargo run -q --example $e || exit 1; done"
ci = { depends-on = ["fmt", "clippy", "test-nalgebra", "test-faer"] }
bench-quick = { cmd = "cargo run --release --manifest-path benchmarks/compare/Cargo.toml -- run --quick --out benchmarks/compare/results", default-environment = "bench" }
bench-compare = { cmd = "cargo run --release --manifest-path benchmarks/compare/Cargo.toml -- run --out benchmarks/compare/results", default-environment = "bench" }
bench-report = { cmd = "python benchmarks/compare/report.py --input benchmarks/compare/results/results.json --output-dir benchmarks/compare/results/report --format both", default-environment = "bench" }
bench-cpp = { cmd = "cd ../exp-mop && pixi run build-bench", description = "Build the C++ tinyopt benchmark binary (sibling checkout)" }
clippy-bench = { cmd = "cargo clippy --manifest-path benchmarks/compare/Cargo.toml --release -- -D warnings", default-environment = "bench" }
