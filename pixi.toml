[workspace]
name = "tinyopt"
version = "0.8.0"
description = "A lightweight, Rust native optimization library"
authors = ["Julien Michot"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
rust = ">=1.85"

[tasks]
build = "cargo build --all-targets"
test = "cargo test"
test-nalgebra = "cargo test --no-default-features --features nalgebra"
test-faer = "cargo test --no-default-features --features faer"
fmt = "cargo fmt --all -- --check"
clippy = "cargo clippy --all-targets -- -D warnings"
doc = "cargo doc --no-deps"
bench = "cargo bench --bench dense"
examples = "for e in astronomy biology computer_vision finance physics robotics signal_processing; do cargo run -q --example $e || exit 1; done"
ci = { depends-on = ["fmt", "clippy", "test-nalgebra", "test-faer"] }
